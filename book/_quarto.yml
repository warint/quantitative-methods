# Generated by scripts/build_book.py — edit that, not this.
project:
  type: book
  output-dir: ../docs/book

book:
  title: "Quantitative Methods in International Business with Python"
  subtitle: "MATH60033A · HEC Montréal"
  author: "Thierry Warin, PhD"
  date: last-modified
  date-format: "D MMMM YYYY"
  search: true
  repo-url: https://github.com/warint/quantitative-methods
  repo-branch: main
  repo-actions: [source, issue]
  downloads: [pdf]
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: "MATH60033A · HEC Montréal"
    right: "Built from the course repository"
  chapters:
    - index.qmd
    - session-01.qmd
    - session-02.qmd
    - session-03.qmd
    - session-04.qmd
    - session-05.qmd
    - session-06.qmd
    - session-07.qmd
    - session-08.qmd
    - session-09.qmd
    - session-10.qmd
    - session-11.qmd
    - session-12.qmd
  appendices:
    - setup.qmd
    - data-api.qmd
    - replications.qmd
    - further-reading.qmd

bibliography: references.bib
link-citations: true

filters:
  - divs-to-latex.lua

format:
  html:
    theme: [cosmo, book.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    code-fold: true
    code-summary: "Show the code"
    code-tools:
      source: false
      toggle: true
      caption: "Code"
    link-external-newwindow: true
    df-print: kable

  pdf:
    documentclass: scrbook
    classoption: [10pt, twoside, openright, numbers=noenddot, chapterprefix=true]
    pdf-engine: xelatex
    mainfont: "Times New Roman"
    sansfont: "Helvetica Neue"
    monofont: "Menlo"
    monofontoptions: [Scale=0.82]
    include-in-header: preamble.tex
    keep-tex: true
    colorlinks: true
    linkcolor: econblue
    citecolor: econblue
    urlcolor: econblue
    toc: true
    toc-depth: 2
    lof: false
    number-sections: true
    fig-pos: "htbp"
    fig-width: 5.0
    fig-height: 3.4
    code-overflow: wrap
    highlight-style: github
    df-print: kable

execute:
  freeze: auto
  warning: false
